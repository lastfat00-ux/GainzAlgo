<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>▲ BUY (85%) | GainzAlgo</title>
  <style>
    :root { --buy: #34d399; --sell: #f87171; --warning: #fbbf24; --bg: #0f172a; --text: #f8fafc; --card: #1e293b; --primary: #60a5fa; }
    body { background: var(--bg); color: var(--text); font-family: system-ui; margin: 0; line-height: 1.5; }
    .skip-link { position: absolute; top: -40px; left: 0; background: var(--primary); color: white; padding: 8px; z-index: 100; transition: top 0.2s; }
    .skip-link:focus { top: 0; outline: 3px solid white; }
    .container { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card); border-radius: 12px; padding: 1.5rem; border: 1px solid #334155; }
    .signal { display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 1.5rem; margin-bottom: 1rem; cursor: pointer; transition: transform 0.2s, filter 0.2s; width: fit-content; border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
    .signal:hover { filter: brightness(1.2); }
    .signal:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    .signal:active { transform: scale(0.98); }
    .buy { color: var(--buy); }
    .sell { color: var(--sell); }
    .glow { text-shadow: 0 0 12px currentColor; }
    .spinning { animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .meter-label { display: block; font-size: 0.875rem; color: #cbd5e1; margin-bottom: 0.5rem; }
    .meter-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; width: 100%; margin-bottom: 1.5rem; }
    .meter-fill { background: var(--buy); height: 100%; transition: width 0.3s ease; }
    .btn { background: var(--primary); color: #0f172a; border: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; transition: filter 0.2s; }
    .btn:hover { filter: brightness(1.1); }
    .btn:focus-visible { outline: 2px solid white; outline-offset: 2px; }
    .btn:active, .btn-active { transform: scale(0.95); filter: brightness(0.9); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); transform: none !important; }
    .status-meta { font-size: 0.75rem; color: #cbd5e1; margin-top: 1rem; display: block; }
    .live-badge { display: flex; align-items: center; gap: 4px; background: rgba(16, 185, 129, 0.1); padding: 2px 6px; border-radius: 4px; }
    .pulse { width: 6px; height: 6px; background: var(--buy); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    kbd { background: #334155; border: 1px solid #475569; border-radius: 4px; box-shadow: 0 1px 0 #1e293b; color: #f8fafc; font-family: inherit; font-size: 0.65rem; font-weight: 700; padding: 1px 4px; vertical-align: middle; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } .pulse { animation: none; opacity: 0.8; } .spinning { animation: none !important; } }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="container"><h1>GainzAlgo <span role="img" aria-label="chart increasing">📈</span></h1></header>
  <main id="main" class="container">
    <div class="card">
      <section aria-labelledby="signal-title">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <h2 id="signal-title" style="margin: 0; font-size: 1.1rem; color: #cbd5e1;">Current Signal</h2>
          <div class="live-badge" aria-label="Live data connection active"><span class="pulse" aria-hidden="true"></span> <span style="font-size: 0.65rem; font-weight: 800; color: var(--buy); letter-spacing: 0.05em;">LIVE</span></div>
        </div>
        <div id="signal-display" class="signal buy glow" role="button" tabindex="0" title="Click or press C to copy" aria-label="Buy Signal Detected. Click or press C to copy."><span id="signal-icon" aria-hidden="true">▲</span> <span id="signal-text">BUY</span> <kbd aria-hidden="true" style="margin-left: 4px; font-size: 0.65rem;">C</kbd></div>
        <div class="meter-container">
          <span id="meter-desc" class="meter-label" title="Confidence >= 85% is Strong, otherwise Moderate.">Signal Confidence: <span id="conf-val">85</span>% (<span id="conf-tier">Strong</span>) <span id="trend-icon" role="img" style="font-weight: bold;"></span><span id="conf-delta" style="font-size: 0.75rem; margin-left: 2px;"></span></span>
          <div class="meter-bg" role="progressbar" aria-valuenow="85" aria-valuetext="85% Strong" aria-valuemin="0" aria-valuemax="100" aria-labelledby="meter-desc"><div id="meter-fill" class="meter-fill" style="width: 85%; background: var(--buy);"></div></div>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
          <button id="refresh-btn" class="btn" aria-label="Refresh signal (Shortcut: R)" title="Shortcut: R"><span id="refresh-icon" aria-hidden="true" style="margin-right: 4px; display: inline-block;">↻</span><span id="refresh-label">Refresh Signal</span> <kbd aria-hidden="true" style="margin-left: 4px;">R</kbd></button>
          <button id="copy-btn" class="btn" style="background: transparent; border: 1px solid var(--primary); color: var(--primary);" aria-label="Copy signal (Shortcut: C)" title="Shortcut: C"><span id="copy-label">Copy</span> <span role="img" aria-label="clipboard" id="copy-emoji">📋</span> <kbd aria-hidden="true" style="margin-left: 4px;">C</kbd></button>
        </div>
        <span id="last-updated" class="status-meta">Last updated: Just now</span>
        <div id="announcer" aria-live="polite" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;"></div>
      </section>
    </div>
  </main>
  <script>
    let lastConf = 85;
    let lastUpdateTime = Date.now();
    let currentTitle = document.title;
    let titleTimeout = null;
    const btn = document.getElementById('refresh-btn');
    const announcer = document.getElementById('announcer');
    const announce = (msg) => { announcer.textContent = ''; setTimeout(() => announcer.textContent = msg, 50); };

    const updateTimeDisplay = () => {
      const elapsed = Math.floor((Date.now() - lastUpdateTime) / 1000);
      const el = document.getElementById('last-updated');
      if (elapsed < 5) el.textContent = 'Last updated: Just now';
      else if (elapsed < 60) el.textContent = `Last updated: ${elapsed}s ago`;
      else el.textContent = `Last updated: ${Math.floor(elapsed / 60)}m ago`;
    };
    setInterval(updateTimeDisplay, 1000);
    document.getElementById('last-updated').title = `Exact time: ${new Date().toLocaleTimeString()}`;

    const animateValue = (id, start, end, duration) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.getElementById(id).textContent = end;
        return;
      }
      const obj = document.getElementById(id);
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.textContent = Math.floor(progress * (end - start) + start);
        if (progress < 1) window.requestAnimationFrame(step);
      };
      window.requestAnimationFrame(step);
    };

    const refresh = async () => {
      if (btn.disabled) return;
      btn.disabled = true;
      const label = document.getElementById('refresh-label');
      const refreshIcon = document.getElementById('refresh-icon');
      const originalText = label.textContent, originalLabel = btn.getAttribute('aria-label');
      label.textContent = 'Refreshing...'; btn.setAttribute('aria-label', 'Refreshing signal...');
      refreshIcon.classList.add('spinning');

      await new Promise(r => setTimeout(r, 800));
      const confidence = Math.floor(Math.random() * 20) + 75;
      const delta = confidence - lastConf;
      const trend = confidence > lastConf ? 'up' : confidence < lastConf ? 'down' : 'stable';
      const trendIcon = { up: '↑', down: '↓', stable: '→' }[trend];
      const trendColor = { up: 'var(--buy)', down: 'var(--sell)', stable: 'var(--text)' }[trend];
      const trendLabel = { up: 'increasing', down: 'decreasing', stable: 'stable' }[trend];
      const tier = confidence >= 85 ? 'Strong' : 'Moderate';
      const signalType = Math.random() > 0.5 ? 'BUY' : 'SELL';
      const signalIconChar = signalType === 'BUY' ? '▲' : '▼';
      const deltaText = delta !== 0 ? ` (${delta > 0 ? '+' : ''}${delta}%)` : '';

      currentTitle = `${signalIconChar} ${signalType} ${confidence}%${deltaText} | GainzAlgo`;
      if (!titleTimeout) document.title = currentTitle;

      animateValue('conf-val', lastConf, confidence, 500);
      const tierEl = document.getElementById('conf-tier');
      tierEl.textContent = tier;
      tierEl.style.color = signalType === 'BUY' ? (tier === 'Strong' ? 'var(--buy)' : 'var(--warning)') : 'var(--sell)';

      const deltaEl = document.getElementById('conf-delta');
      deltaEl.textContent = delta !== 0 ? `${delta > 0 ? '+' : ''}${delta}%` : '';
      deltaEl.style.color = delta > 0 ? 'var(--buy)' : delta < 0 ? 'var(--sell)' : 'var(--text)';

      const signalDisplay = document.getElementById('signal-display');
      const signalIcon = document.getElementById('signal-icon');
      const signalText = document.getElementById('signal-text');
      signalText.textContent = signalType;
      signalIcon.textContent = signalType === 'BUY' ? '▲' : '▼';
      signalDisplay.className = `signal ${signalType.toLowerCase()}${tier === 'Strong' ? ' glow' : ''}`;
      signalDisplay.setAttribute('aria-label', `${signalType} Signal Detected. Click or press C to copy.`);

      const trendEl = document.getElementById('trend-icon');
      trendEl.textContent = trendIcon;
      trendEl.style.color = trendColor;
      trendEl.setAttribute('aria-label', `Trend: ${trendLabel}`);

      lastConf = confidence;
      const fill = document.getElementById('meter-fill');
      fill.style.width = `${confidence}%`;
      fill.style.background = `var(--${signalType === 'BUY' ? (tier === 'Strong' ? 'buy' : 'warning') : 'sell'})`;
      fill.parentElement.setAttribute('aria-valuenow', confidence);
      const ariaDelta = delta !== 0 ? ` (${delta > 0 ? 'up' : 'down'} ${Math.abs(delta)}%)` : '';
      fill.parentElement.setAttribute('aria-valuetext', `${confidence}% ${tier} ${signalType}${ariaDelta}`);
      lastUpdateTime = Date.now();
      const lastUpdatedEl = document.getElementById('last-updated');
      lastUpdatedEl.title = `Exact time: ${new Date().toLocaleTimeString()}`;
      updateTimeDisplay();
      label.textContent = 'Updated!'; btn.setAttribute('aria-label', 'Signal updated successfully');
      refreshIcon.classList.remove('spinning');
      announce(`${signalType} Signal updated: ${confidence}% confidence`);
      setTimeout(() => { label.textContent = originalText; btn.setAttribute('aria-label', originalLabel); btn.disabled = false; }, 1000);
    };
    btn.addEventListener('click', refresh);

    const copyBtn = document.getElementById('copy-btn');
    const copySignal = async () => {
      const confidence = document.getElementById('conf-val').textContent;
      const tier = document.getElementById('conf-tier').textContent;
      const signalType = document.getElementById('signal-text').textContent;
      const timestamp = new Date(lastUpdateTime).toLocaleTimeString([], { hour12: false });
      const text = `[${timestamp}] ${signalType} - ${confidence}% Confidence (${tier})`;

      try {
        await navigator.clipboard.writeText(text);
        const copyLabel = document.getElementById('copy-label');
        const copyEmoji = document.getElementById('copy-emoji');
        const signalIcon = document.getElementById('signal-icon');
        const signalDisplay = document.getElementById('signal-display');
        const originalText = copyLabel.textContent, originalLabel = copyBtn.getAttribute('aria-label'), originalEmoji = copyEmoji.textContent;
        const originalSignalIcon = signalIcon.textContent, originalSignalTitle = signalDisplay.title;

        copyLabel.textContent = 'Copied!';
        copyEmoji.textContent = '✅';
        signalIcon.textContent = '✅';
        copyBtn.setAttribute('aria-label', 'Signal copied to clipboard');
        signalDisplay.title = 'Copied!';
        document.title = `✅ Copied! | GainzAlgo`;
        if (titleTimeout) clearTimeout(titleTimeout);
        titleTimeout = setTimeout(() => {
          document.title = currentTitle;
          titleTimeout = null;
        }, 2000);
        announce('Signal copied to clipboard');

        setTimeout(() => {
          copyLabel.textContent = originalText;
          copyEmoji.textContent = originalEmoji;
          signalIcon.textContent = originalSignalIcon;
          copyBtn.setAttribute('aria-label', originalLabel);
          signalDisplay.title = originalSignalTitle;
        }, 2000);
      } catch (err) {
        console.error('Failed to copy: ', err);
      }
    };
    copyBtn.addEventListener('click', copySignal);
    const signalDisplay = document.getElementById('signal-display');
    signalDisplay.addEventListener('click', () => {
      signalDisplay.classList.add('btn-active');
      copySignal();
      setTimeout(() => signalDisplay.classList.remove('btn-active'), 150);
    });
    signalDisplay.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copySignal(); } });

    document.addEventListener('keydown', e => {
      if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === 'r') {
        btn.classList.add('btn-active');
        refresh();
        setTimeout(() => btn.classList.remove('btn-active'), 150);
      }
      if (key === 'c') {
        [copyBtn, signalDisplay].forEach(el => el.classList.add('btn-active'));
        copySignal();
        setTimeout(() => [copyBtn, signalDisplay].forEach(el => el.classList.remove('btn-active')), 150);
      }
    });
  </script>
</body>
</html>
